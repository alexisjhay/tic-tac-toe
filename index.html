<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="css/style.css" />
		<script src="javascript/script.js" defer></script>
	</head>
	<body>
		<div class="container">
			<h1>Tic-Tac-Toe</h1>

			<form>
				<label for="player1">Player X</label>
				<label for="player2">Player O</label>
				<input type="text" placeholder="Player 1" id="player1" required />

				<input type="text" placeholder="Player 2" id="player2" required />

				<button type="submit" class="btn-start">Start New Game</button>
			</form>

			<p class="result">Player 1's Turn</p>

			<div class="gameboard">
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
				<div class="cell"></div>
			</div>

			<div class="scores">
				<div class="score-player1">Player 1(X): 0</div>
				<button class="reset">Restart</button>
				<div class="score-player2">Player 2(O): 0</div>
			</div>
		</div>
	</body>
</html>
