<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="css/style.css" />
		<script src="javascript/script.js" defer></script>
	</head>
	<body>
		<div class="container">
			<h1>Tic-Tac-Toe</h1>

			<form>
				<label for="player-x">Player X</label>
				<label for="player-y">Player O</label>
				<input type="text" placeholder="Player 1" id="player-x" />

				<input type="text" placeholder="Player 2" id="player-y" />

				<button type="submit">Start New Game</button>
			</form>

			<p class="result"></p>

			<div class="gameboard"></div>

			<div class="scores">
				<div class="player1">Player 1(X): 5</div>
				<div class="draw">Draw: 5</div>
				<div class="player2">Player 2(O): 5</div>
			</div>
		</div>
	</body>
</html>
